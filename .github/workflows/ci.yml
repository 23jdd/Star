name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run '^$' -fuzz '^FuzzConstraintsNeverReturnNegativeSize$' -fuzztime=10s ./widgets
      - run: go test -run '^$' -fuzz '^FuzzCanvasBounds$' -fuzztime=10s ./widgets
      - run: go test -run '^$' -fuzz '^FuzzTextAreaCursorBounds$' -fuzztime=10s ./widgets
